name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check main.mjs
          node --check meter.mjs
          node --check meter-worker.mjs
          node --check preload.cjs
      - name: Data layer smoke (no db on CI: expect clean ok=false shape)
        run: |
          node -e "
            const out = require('child_process').execSync('node meter.mjs').toString();
            const s = JSON.parse(out);
            if (typeof s.ok !== 'boolean') { console.error('snapshot shape broken:', s); process.exit(1); }
            console.log('meter.mjs smoke ok, ok=' + s.ok + ' reason=' + (s.reason || '-'));
          "
