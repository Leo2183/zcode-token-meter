<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>token-meter</title>
<style>
  :root {
    --bg: rgba(14, 18, 24, 0.94);
    --border: rgba(255, 255, 255, 0.09);
    --text: #e6edf3;
    --dim: #8b949e;
    --accent: #4ade80;
    --blue: #7dd3fc;
    --amber: #fbbf24;
    --red: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; }
  body {
    font-family: "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
    color: var(--text);
    -webkit-app-region: drag; /* 整卡可拖动 */
    overflow: hidden;
  }
  .card {
    position: relative;
    width: 260px; /* 正常态定宽,zoom 随字号缩放;窗口尺寸由 measure() 上报适配 */
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 9px 11px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }
  .hdr { display: flex; align-items: center; gap: 5px; font-size: 10.5px; }
  .logo { color: var(--accent); font-weight: 700; }
  .model {
    color: var(--dim); background: rgba(255,255,255,0.06);
    padding: 0 6px; border-radius: 999px; font-size: 9.5px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); margin-left: auto; }
  .dot.completed { background: var(--accent); }
  .dot.error { background: var(--red); }
  .dot.cancelled { background: var(--amber); }
  .btn {
    -webkit-app-region: no-drag; border: none; background: transparent;
    color: var(--dim); font-size: 11px; line-height: 1; cursor: pointer; padding: 1px 3px;
  }
  .btn:hover { color: var(--text); }
  .btn.close:hover { color: var(--red); }

  /* 胶囊态:整卡变药丸行,只留 tok/s 与 TTFT */
  .card.capsule { border-radius: 999px; padding: 7px 11px; flex-direction: row; align-items: center; gap: 8px; width: fit-content; }
  #cap { display: none; align-items: baseline; gap: 7px; flex-wrap: nowrap; }
  #cap .c-tps, #cap .c-ttft, #cap .c-unit, #cap .c-logo { flex-shrink: 0; white-space: nowrap; }
  .card.capsule #cap { display: flex; }
  .card.capsule .hdr, .card.capsule #body, .card.capsule #empty, .card.capsule .ftr { display: none !important; }
  #cap .c-logo { color: var(--accent); font-weight: 700; font-size: 11px; }
  #cap .c-tps { color: var(--accent); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #cap .c-tps.flash { animation: flash 0.9s ease-out; }
  #cap .c-unit { font-size: 9px; color: var(--dim); }
  #cap .c-ttft { color: var(--blue); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #cap .btn { font-size: 12px; padding: 1px 4px; }

  .big { display: flex; align-items: baseline; gap: 10px; }
  .big .tps { color: var(--accent); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .big .tps.flash { animation: flash 0.9s ease-out; }
  @keyframes flash { 0% { color: #fff; } 100% { color: inherit; } }
  .big .unit { font-size: 9.5px; color: var(--dim); margin-right: 4px; }
  .big .ttft { color: var(--blue); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .big .req { font-size: 10px; color: var(--dim); margin-left: auto; }

  .line { font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; }
  .line b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  .ctxbar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; display: flex; margin-top: 3px; }
  .ctxbar .cache { background: #1f6f43; height: 100%; }
  .ctxbar .fresh { background: var(--accent); height: 100%; opacity: 0.85; }

  /* 悬停取数值需要鼠标事件,拖动区会让给标题等其余区域 */
  .chart { -webkit-app-region: no-drag; }
  .chart svg { width: 100%; height: 60px; display: block; }
  .chart g { transition: opacity 0.15s; }
  .chart svg.dim g:not(.hl) { opacity: 0.35; }
  .tip {
    position: absolute; z-index: 10; display: none; pointer-events: none;
    background: rgba(2, 6, 12, 0.96); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 7px; padding: 5px 8px; font-size: 10px; line-height: 1.55;
    color: var(--text); white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  }
  .tip .k { color: var(--dim); margin-right: 5px; }
  .tip .v { font-weight: 600; font-variant-numeric: tabular-nums; }

  .ftr { display: flex; justify-content: space-between; font-size: 9px; color: var(--dim); white-space: nowrap; }
  .empty { text-align: center; color: var(--dim); font-size: 11px; line-height: 1.8; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="hdr">
    <span class="logo">⚡ token-meter</span>
    <span class="model" id="model">…</span>
    <span class="dot" id="dot"></span>
    <button class="btn" id="fontBtn" title="字号(或 Ctrl+滚轮 / 右键菜单)">Aa</button>
    <button class="btn" id="shrinkBtn" title="缩小为胶囊">—</button>
    <button class="btn close" id="close" title="退出">✕</button>
  </div>

  <div id="cap">
    <span class="c-logo">⚡</span>
    <span class="c-tps" id="capTps">–</span><span class="c-unit">tok/s</span>
    <span class="c-ttft" id="capTtft">–</span>
    <button class="btn" id="restoreBtn" title="恢复完整窗口">▢</button>
  </div>

  <div id="body" style="display:none; flex-direction:column; gap:6px;">
    <div class="big">
      <span class="tps" id="tps">–</span><span class="unit">tok/s</span>
      <span class="ttft" id="ttft">–</span>
      <span class="req" id="req">–</span>
    </div>

    <div>
      <div class="line" id="ctxline">…</div>
      <div class="ctxbar"><div class="cache" id="ctxCache" style="width:0%"></div><div class="fresh" id="ctxFresh" style="width:0%"></div></div>
    </div>

    <div class="line" id="cumline">…</div>

    <div class="chart">
      <svg id="turnSvg" viewBox="0 0 236 60" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div id="empty" class="empty">等待数据…<br><span style="font-size:9.5px">开始一次 ZCode 对话即有读数</span></div>

  <div class="ftr"><span id="freshness">–</span><span id="chartLegend"></span></div>

  <div class="tip" id="tip"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const kfmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
  const fmtMs = (ms) => ms == null ? '–' : (ms >= 10000 ? (ms / 1000).toFixed(1) + 's' : (ms / 1000).toFixed(2) + 's');

  $('close').addEventListener('click', () => window.overlay.quit());

  // ---- 字号缩放:body.zoom 等比放大全部尺寸,窗口尺寸随后续 measure() 跟着变 ----
  const PRESETS = [0.85, 1, 1.15, 1.3];
  let scale = 1;
  let inited = false;

  function applyScale(s) {
    scale = s;
    document.body.style.zoom = s;
    requestAnimationFrame(measure);
  }
  function setScale(s, notify = true) {
    s = Math.min(1.6, Math.max(0.75, Math.round(s * 100) / 100));
    if (Math.abs(s - scale) < 0.005) return;
    applyScale(s);
    if (notify) window.overlay.setScale(s);
  }
  $('fontBtn').addEventListener('click', () => {
    let next = PRESETS.find(p => p > scale + 0.01);
    setScale(next == null ? PRESETS[0] : next);
  });
  window.addEventListener('wheel', (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    setScale(scale * (e.deltaY < 0 ? 1.06 : 1 / 1.06));
  }, { passive: false });

  // ---- 胶囊态:只留 tok/s 与 TTFT 的药丸行,尺寸经 measure() 自动上报收缩 ----
  let capsule = false;
  function applyCapsule(on) {
    capsule = !!on;
    $('card').classList.toggle('capsule', capsule);
  }
  function setCapsule(on, notify = true) {
    if (on === capsule) return;
    applyCapsule(on);
    if (notify) window.overlay.setCapsule(on);
  }
  $('shrinkBtn').addEventListener('click', () => setCapsule(true));
  $('restoreBtn').addEventListener('click', () => setCapsule(false));

  // ---- 高度自适应:实测卡片尺寸上报主进程,变化>=1px 才发 ----
  let lastW = 0, lastH = 0;
  function measure() {
    const r = $('card').getBoundingClientRect();
    const w = Math.round(r.width), h = Math.round(r.height);
    if (Math.abs(w - lastW) >= 1 || Math.abs(h - lastH) >= 1) {
      lastW = w; lastH = h;
      window.overlay.resize({ w, h });
    }
  }
  new ResizeObserver(() => requestAnimationFrame(measure)).observe($('card'));

  window.overlay.onInit(({ scale: s, capsule: c }) => {
    if (!inited) { inited = true; applyScale(s); applyCapsule(!!c); }
  });
  window.overlay.onScale((s) => { if (Math.abs(s - scale) >= 0.005) applyScale(s); });

  // ---- 渲染 ----
  let lastTs = null;
  let lastRowId = null;

  function render(s) {
    if (capsule) {
      if (s && s.ok === true && !s.empty) {
        const capTps = $('capTps');
        const tps = s.turn.tps;
        capTps.textContent = tps ? tps.toFixed(0) : '–';
        if (s.turn.lastId && s.turn.lastId !== lastRowId) {
          capTps.classList.remove('flash'); void capTps.offsetWidth; capTps.classList.add('flash');
          lastRowId = s.turn.lastId;
        }
        $('capTtft').textContent = 'TTFT ' + fmtMs(s.turn.ttftMs);
      } else {
        $('capTps').textContent = '–';
        $('capTtft').textContent = 'TTFT –';
      }
      return;
    }
    if (!s || s.ok !== true || s.empty) {
      $('empty').style.display = '';
      $('body').style.display = 'none';
      $('empty').firstChild.textContent = s && s.ok === false ? ('读取失败:' + (s.reason || '未知')) : '等待数据…';
      measure();
      return;
    }
    $('empty').style.display = 'none';
    $('body').style.display = 'flex';

    lastTs = s.ts;
    $('model').textContent = s.session.model || '–';
    $('dot').className = 'dot ' + (s.turn.lastStatus || '');

    const tps = s.turn.tps;
    const tpsEl = $('tps');
    tpsEl.textContent = tps ? tps.toFixed(0) : '–';
    if (s.turn.lastId && s.turn.lastId !== lastRowId) {
      tpsEl.classList.remove('flash'); void tpsEl.offsetWidth; tpsEl.classList.add('flash');
      lastRowId = s.turn.lastId;
    }
    $('ttft').textContent = 'TTFT ' + fmtMs(s.turn.ttftMs);
    $('req').textContent = s.turn.done + '/' + s.turn.requests + ' req';

    const pct = s.ctx.limit > 0 ? Math.min(100, s.ctx.tokens / s.ctx.limit * 100) : 0;
    const cachePct = s.ctx.cacheRate != null ? s.ctx.cacheRate * pct : 0;
    $('ctxline').innerHTML = 'ctx <b>' + kfmt(s.ctx.tokens) + '</b>/' + kfmt(s.ctx.limit) +
      '(' + pct.toFixed(0) + '%' + (s.ctx.cacheRate != null ? ' · 缓存 ' + (s.ctx.cacheRate * 100).toFixed(0) + '%' : '') + ')';
    $('ctxCache').style.width = cachePct.toFixed(2) + '%';
    $('ctxFresh').style.width = Math.max(0, pct - cachePct).toFixed(2) + '%';

    $('cumline').innerHTML = '累计 读入<b>' + kfmt(s.cum.in) + '</b>(新<b>' + kfmt(s.cum.in - s.cum.cache) +
      '</b>)+生成<b>' + kfmt(s.cum.out) + '</b>';

    drawTurns(s.turns);
    tickFreshness();
  }

  // 每轮消耗三层堆叠柱:命中(缓存读,绿)/未命中(新处理,琥珀)/输出(蓝)。
  // 整柱总高线性正比该轮总消耗(以窗口内最大轮为满高,柱间可比);
  // 柱内三层按 √ 比例拆分——缓存命中常态 98%+,线性拆分会把未中/输出压成看不见的细线。
  let turnData = [];
  let hoverIdx = null; // 图表每 POLL_MS 重绘会替换柱子元素,记住悬停的轮次以恢复高亮与 tooltip
  function drawTurns(turns) {
    const svg = $('turnSvg');
    turnData = (turns || []).filter(t => t.hit + t.miss + t.out > 0).slice(-24);
    if (!turnData.length) {
      svg.innerHTML = '';
      $('chartLegend').textContent = '';
      hoverIdx = null;
      hideTip();
      return;
    }
    const W = 236, H = 60, PAD = 2, AVAIL = H - 2 * PAD;
    // 固定柱宽:按 13 根铺满图表的上一版形态(柱 12.7px/间距 5.5px),不随轮数变化;
    // 超出的旧轮从左侧滚出,最新一轮始终贴右
    const CAP = 13;
    turnData = turnData.slice(-CAP);
    const maxT = Math.max(...turnData.map(t => t.hit + t.miss + t.out));
    const pitch = W / CAP, barW = pitch * 0.7;
    const LAYERS = [
      { key: 'hit', color: 'rgba(74,222,128,0.55)' },
      { key: 'miss', color: '#fbbf24' },
      { key: 'out', color: '#7dd3fc' },
    ];
    let out = '';
    turnData.forEach((t, i) => {
      const total = t.hit + t.miss + t.out;
      const barH = total / maxT * AVAIL; // 整柱线性,无需防溢出压缩
      const shares = LAYERS.map(l => Math.sqrt(t[l.key]));
      const sSum = shares[0] + shares[1] + shares[2];
      const x = W - 3 - (turnData.length - 1 - i) * pitch - barW;
      let y = H - PAD;
      let drawn = 0;
      out += '<g data-idx="' + i + '">';
      LAYERS.forEach((l, j) => {
        const h = Math.round(shares[j] / (sSum || 1) * barH);
        if (h >= 1) { y -= h; drawn += h; out += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + barW.toFixed(1) + '" height="' + h + '" fill="' + l.color + '"/>'; }
      });
      if (!drawn) { y -= 1; out += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + barW.toFixed(1) + '" height="1" fill="' + LAYERS[0].color + '"/>'; } // 有数据但不足 1px 的柱保底
      out += '</g>';
    });
    svg.innerHTML = out;
    $('chartLegend').innerHTML = '<span style="color:#4ade80">■</span>命中 <span style="color:#fbbf24">■</span>未中 <span style="color:#7dd3fc">■</span>输出(柱高∝总量)';
    if (hoverIdx != null && hoverIdx < turnData.length) {
      const g = svg.querySelector('g[data-idx="' + hoverIdx + '"]');
      if (g) showTip(hoverIdx, g); else hideTip();
    }
  }

  // ---- 悬停 tooltip ----
  const tipEl = $('tip');
  function hideTip() {
    hoverIdx = null;
    tipEl.style.display = 'none';
    $('turnSvg').classList.remove('dim');
  }
  function showTip(idx, gEl) {
    const t = turnData[idx];
    if (!t) return;
    hoverIdx = idx;
    const num = turnData.length - idx; // 距最新的轮数,1=最近一轮
    tipEl.innerHTML =
      '<div><span class="k">第-' + num + ' 轮</span></div>' +
      '<div><span class="k">命中</span><span class="v" style="color:#4ade80">' + kfmt(t.hit) + '</span></div>' +
      '<div><span class="k">未中</span><span class="v" style="color:#fbbf24">' + kfmt(t.miss) + '</span></div>' +
      '<div><span class="k">输出</span><span class="v" style="color:#7dd3fc">' + kfmt(t.out) + '</span></div>' +
      '<div><span class="k">合计</span><span class="v">' + kfmt(t.hit + t.miss + t.out) + '</span></div>';
    tipEl.style.display = 'block';

    // 视觉坐标 → 布局坐标(除以 zoom),再夹回卡片内
    const cardR = $('card').getBoundingClientRect();
    const gR = gEl.getBoundingClientRect();
    const z = scale || 1;
    const cx = (gR.left + gR.width / 2 - cardR.left) / z;
    let left = cx - tipEl.offsetWidth / 2;
    left = Math.max(3, Math.min(left, (cardR.width / z) - tipEl.offsetWidth - 3));
    let top = (gR.top - cardR.top) / z - tipEl.offsetHeight - 4; // 优先在柱子上方
    if (top < 3) top = (gR.bottom - cardR.top) / z + 4; // 上方放不下放下方
    tipEl.style.left = left + 'px';
    tipEl.style.top = top + 'px';

    const svg = $('turnSvg');
    svg.classList.add('dim');
    svg.querySelectorAll('g[data-idx]').forEach(g => g.classList.toggle('hl', g === gEl));
  }
  $('turnSvg').addEventListener('mouseover', (e) => {
    const g = e.target.closest('g[data-idx]');
    if (g) showTip(+g.dataset.idx, g);
  });
  $('turnSvg').addEventListener('mouseout', (e) => {
    if (e.target.closest('g[data-idx]') && !e.relatedTarget?.closest?.('g[data-idx]')) hideTip();
  });
  $('turnSvg').addEventListener('mouseleave', hideTip);

  function tickFreshness() {
    if (lastTs) $('freshness').textContent = '更新 ' + Math.max(0, Math.round((Date.now() - lastTs) / 1000)) + 's 前';
  }
  setInterval(tickFreshness, 1000);

  window.overlay.onSnapshot(render);
</script>
</body>
</html>
